services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /var/lib/xdigitex-trade
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      XDIGITEX_PAY_API_KEY: "${XDIGITEX_PAY_API_KEY:-}"
      XDIGITEX_PAY_BASE_URL: "${XDIGITEX_PAY_BASE_URL:-https://pay.xdigitex.space/api}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
    volumes:
      - trade-data:/var/lib/xdigitex-trade
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  trade-data:
